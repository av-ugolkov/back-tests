version: '3.9'

services:
  postgres:
    container_name: hash-index
    image: postgres:17.3-alpine3.21
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - /var/lib/postgresql/examples/data:/var/lib/postgresql/data
